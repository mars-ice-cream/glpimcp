name: Tests

on: [push, pull_request]

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring
      - name: Syntaxe PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Tests unitaires
        run: php tests/unit/run.php
      - name: Traductions
        run: sudo apt-get install -y gettext >/dev/null && msgfmt --check -o /dev/null locales/fr_FR.po
      - name: XML du catalogue
        run: python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse('glpimcp.xml')"

  static:
    name: Analyse statique (GLPI ${{ matrix.glpi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        glpi: ['11.0.12', '12.0.1']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring
      - name: GLPI ${{ matrix.glpi }} et PHPStan
        run: |
          curl -fsSL "https://github.com/glpi-project/glpi/releases/download/${{ matrix.glpi }}/glpi-${{ matrix.glpi }}.tgz" | tar xz -C "$RUNNER_TEMP"
          curl -fsSL https://github.com/phpstan/phpstan/releases/download/2.1.17/phpstan.phar -o "$RUNNER_TEMP/phpstan.phar"
      - name: Méthodes, classes et signatures de GLPI
        run: GLPI_DIR="$RUNNER_TEMP/glpi" php -d memory_limit=2G "$RUNNER_TEMP/phpstan.phar" analyse -c tests/phpstan.neon --no-progress

  e2e:
    name: Bout en bout (GLPI ${{ matrix.glpi }} jetable)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    strategy:
      fail-fast: false
      matrix:
        glpi: ['11.0.12', '12.0.1']
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      GLPI_VERSION: ${{ matrix.glpi }}
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: glpi_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, mysqli, gd, curl, zip, bz2, exif, sodium, opcache
          ini-values: memory_limit=512M
      - name: Client MySQL et requests
        run: sudo apt-get install -y mariadb-client >/dev/null && pip install requests
      - name: Plugin VulnWatch (intégration testée s'il s'installe sur cette version de GLPI)
        run: |
          git clone -q --depth 1 --branch v1-initial https://github.com/mars-ice-cream/vulnwatch "$RUNNER_TEMP/vulnwatch" \
            || git clone -q --depth 1 https://github.com/mars-ice-cream/vulnwatch "$RUNNER_TEMP/vulnwatch" || true
          echo "VULNWATCH_DIR=$RUNNER_TEMP/vulnwatch" >> "$GITHUB_ENV"
      - name: GLPI jetable, plugin, données de test
        run: bash tests/e2e/ci_setup.sh
      - name: Tests de bout en bout
        run: bash tests/e2e/ci_run.sh
      - name: Journaux en cas d'échec
        if: failure()
        run: |
          tail -n 80 "$RUNNER_TEMP/glpimcp-e2e/php-server.log" || true
          tail -n 80 "$RUNNER_TEMP/glpimcp-e2e/glpi/files/_log/php-errors.log" || true

